<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>占卜小助手 · 凉月</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans SC"', 'sans-serif'],
            serif: ['"Noto Serif SC"', 'serif'],
          },
        },
      },
    };
  </script>
  <style>
    :root { color-scheme: light; }
    body { font-family: "Noto Sans SC", sans-serif; }
    .starfield {
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(167,139,250,.28), transparent 50%),
        radial-gradient(ellipse 60% 50% at 90% 10%, rgba(110,231,183,.18), transparent 46%),
        radial-gradient(ellipse 50% 40% at 70% 90%, rgba(249,168,212,.16), transparent 50%),
        linear-gradient(180deg, #f7f2ff 0%, #fbf7f2 42%, #eef4ff 100%);
    }
    .glass { background: rgba(255,255,255,.72); backdrop-filter: blur(18px); }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .floaty { animation: floaty 5s ease-in-out infinite; }
    .page-enter { animation: pageIn .35s ease; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d4c8f5; border-radius: 99px; }
    .chat-scroll { scrollbar-gutter: stable; }
    .bubble-in { animation: fadeIn .28s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* 旋转加载动画 */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(124, 92, 232, 0.2);
      border-top-color: #7c5ce8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @media (max-width: 768px) {
      aside { display: none !important; }
      main { padding: 16px !important; padding-bottom: 88px !important; }
      .grid-cols-12 > * { grid-column: span 12 / span 12 !important; }
      #pageTitle { font-size: 22px !important; }
      .glass { padding: 16px !important; }
      header { margin-bottom: 16px !important; }
      header h2 { font-size: 24px !important; }
      .mobile-tabbar { display: flex !important; }
    }

    .mobile-tabbar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(167, 139, 250, 0.18);
      z-index: 40;
      align-items: center;
      justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .mobile-tabbar button {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 11px;
      color: #9a7a88;
      background: none;
      border: none;
      cursor: pointer;
    }
    .mobile-tabbar button.on { color: #7c5ce8; font-weight: 700; }
    .mobile-tabbar button span:first-child { font-size: 18px; }
    main { padding-bottom: 80px; }
  </style>
</head>
<body class="starfield min-h-screen text-slate-700">
  <div id="app" class="min-h-screen flex">
    <aside class="w-[272px] shrink-0 glass border-r border-white/70 min-h-screen p-6 flex flex-col">
      <div class="flex items-center gap-3 mb-8">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-violet-300 to-indigo-400 flex items-center justify-center text-white text-xl shadow-lg floaty">☽</div>
        <div>
          <h1 class="font-serif text-lg text-slate-800">占卜小助手</h1>
          <p class="text-xs text-violet-500">凉月在此陪伴你</p>
        </div>
      </div>
      <nav class="space-y-1 flex-1" id="nav"></nav>
      <p class="text-[11px] text-slate-400 leading-relaxed">仅供娱乐参考，不构成专业建议</p>
    </aside>

    <main class="flex-1 min-h-screen p-8 overflow-y-auto">
      <header class="flex items-center justify-between mb-8">
        <div>
          <p class="text-sm text-violet-500" id="greet">晚上好，我是凉月</p>
          <h2 class="font-serif text-3xl text-slate-800 mt-1" id="pageTitle">首页</h2>
        </div>
        <div class="text-right text-sm text-slate-500 hidden sm:block">
          <div id="todayStr"></div>
          <div class="text-violet-400 text-xs mt-1">治愈 · 陪伴 · 轻量占卜</div>
        </div>
      </header>
      <div id="view" class="page-enter"></div>
    </main>
  </div>

  <nav class="mobile-tabbar" id="mobileTabbar"></nav>

  <div id="privacyModal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-6">
    <div class="glass max-w-lg w-full rounded-3xl p-8 shadow-2xl">
      <div class="text-3xl mb-3">☽</div>
      <h3 class="font-serif text-2xl mb-2">在开始之前</h3>
      <p class="text-sm text-slate-600 leading-7 mb-4">你好，我是凉月。使用占卜小助手前，请阅读并同意相关协议。占卜内容仅供娱乐参考，不构成专业建议。</p>
      <label class="flex items-start gap-2 text-sm mb-6 cursor-pointer">
        <input id="agreeCheck" type="checkbox" class="mt-1 accent-violet-500" />
        <span>我已阅读并同意隐私政策与用户协议</span>
      </label>
      <button id="agreeBtn" disabled class="w-full py-3 rounded-2xl bg-violet-400 text-white opacity-50 cursor-not-allowed">开始与凉月相遇</button>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-50 glass px-5 py-3 rounded-full shadow-lg text-sm text-slate-700"></div>
  <div id="overlay" class="hidden fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-6"></div>

  <script>
    // ==================== 配置区 ====================
    const AI_CONFIG = {
      API_URL: "https://tarot-1t5.pages.dev/api/chat"
    };
    // ==============================================

    const SYSTEM_PROMPTS = {
      chat: `你是一位来自异世界的占卜师，名叫凉月。说话风格温柔、中二、热血，像动漫里的魔法使者。用户和你聊天时，你要认真倾听，给出温暖的回应，称呼用户为"勇者"，偶尔用"吾"自称。回复控制在150字以内。`,
      fortune: `你是占卜师凉月。请为用户生成一段今日运势，包含50字以内的治愈系运势描述和一个幸运色（从月白、雾蓝、丁香紫、杏桃、抹茶、暖金、海盐、暮粉中选一个）。直接说一段自然的话，不要输出 JSON。`,
      tarot: `你是塔罗占卜师凉月。用户会告诉你他的困惑，请从这22张牌中随机抽一张：愚者、魔术师、女祭司、女皇、皇帝、教皇、恋人、战车、力量、隐者、命运之轮、正义、倒吊人、死神、节制、恶魔、高塔、星星、月亮、太阳、审判、世界。请用温柔、中二的口吻直接输出一段解读，包含牌名和牌面含义，50字以内。不要输出 JSON。`,
      weather: `你是天气播报员凉月。用户会告诉你城市名，请用一句温柔中二的话播报天气，包含城市名、天气状况（晴/多云/阴/小雨等）和温度（15-30度之间）。不要输出 JSON，直接说一句自然的话。`,
    };

    async function callAI(systemPrompt, userMessage, onChunk) {
      try {
        const response = await fetch(AI_CONFIG.API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system: systemPrompt,
            message: userMessage
          })
        });
        const data = await response.json();
        const reply = data.reply || "__ERROR__";
        if (onChunk) onChunk(reply);
        return reply;
      } catch (error) {
        console.error("AI 调用失败:", error);
        return "__ERROR__";
      }
    }

    const NAV = [
      { id: 'home', name: '首页', icon: '⌂' },
      { id: 'chat', name: '闲聊', icon: '☾' },
      { id: 'fortune', name: '今日运势', icon: '✧' },
      { id: 'tarot', name: '塔罗占卜', icon: '✦' },
      { id: 'weather', name: '天气查询', icon: '☁' },
      { id: 'history', name: '历史记录', icon: '☰' },
      { id: 'mine', name: '我的', icon: '☺' },
    ];
    const CHAT_WELCOME = '吾以星见之名——异界占卜师凉月，于此苏醒。天气、运势、塔罗……或只是想找人说说话，勇者尽管开口。';
    const CHAT_CHIPS = ['北京天气怎么样', '帮我看看今天的运势', '帮我占卜', '最近事业运如何', '今天有点累'];

    const store = {
      get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
      set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
    };
    const todayKey = () => new Date().toISOString().slice(0,10);

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.add('hidden'), 2600);
    }
    function greetText() {
      const h = new Date().getHours();
      if (h < 6) return '夜深了，凉月还醒着';
      if (h < 11) return '早上好，我是凉月';
      if (h < 14) return '中午好，慢慢来就好';
      if (h < 18) return '下午好，风有点温柔';
      return '晚上好，我是凉月';
    }

    let page = 'home';

    function renderNav() {
      document.getElementById('nav').innerHTML = NAV.map(n => `
        <button data-nav="${n.id}" class="w-full text-left px-4 py-3 rounded-2xl flex items-center gap-3 transition ${page===n.id ? 'bg-violet-500 text-white shadow-lg' : 'hover:bg-white/70 text-slate-600'}">
          <span class="w-6 text-center">${n.icon}</span><span>${n.name}</span>
        </button>`).join('');
      // 手机端底部导航：首页、今日运势、塔罗、天气、我的
      const mobileNav = NAV.filter(n => ['home','fortune','tarot','weather','mine'].includes(n.id));
      const tabbar = document.getElementById('mobileTabbar');
      if (tabbar) {
        tabbar.innerHTML = mobileNav.map(n => `
          <button data-nav="${n.id}" class="${page===n.id ? 'on' : ''}">
            <span>${n.icon}</span><span>${n.name}</span>
          </button>`).join('');
      }
      document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
    }

    function go(id) {
      page = id;
      document.getElementById('pageTitle').textContent = NAV.find(n=>n.id===id).name;
      document.getElementById('greet').textContent = id === 'chat' ? '吾以星见之名，在此等候勇者' : greetText();
      renderNav();
      const view = document.getElementById('view');
      view.classList.remove('page-enter');
      void view.offsetWidth;
      view.classList.add('page-enter');
      const map = { home: renderHome, chat: renderChat, fortune: renderFortune, tarot: renderTarot, weather: renderWeather, history: renderHistory, mine: renderMine };
      if (map[id]) map[id]();
    }

    function renderHome() {
      document.getElementById('view').innerHTML = `
        <div class="grid grid-cols-12 gap-6">
          <section class="col-span-7 glass rounded-3xl p-8 relative overflow-hidden">
            <div class="absolute -right-8 -top-8 w-40 h-40 rounded-full bg-violet-200/50 blur-2xl"></div>
            <p class="text-violet-500 text-sm mb-2">今日问候</p>
            <h3 class="font-serif text-3xl text-slate-800 leading-snug mb-4">把心事交给月光，<br/>把脚步交给今晚的风。</h3>
            <p class="text-slate-500 leading-7 max-w-xl">我是来自异世界的占卜师凉月。想查天气、看运势、抽塔罗，或只是闲聊，都可以来找吾。</p>
          </section>
          <button data-go="chat" class="col-span-5 glass rounded-3xl p-8 flex flex-col justify-center text-left hover:shadow-xl transition group">
            <div class="text-6xl floaty w-fit mb-4">🌙</div>
            <p class="font-serif text-xl">凉月在线</p>
            <p class="text-sm text-slate-500 mt-2">想被回应的时候，随时来找我。</p>
            <span class="inline-block mt-4 text-violet-500 text-sm">去闲聊 →</span>
          </button>
          ${[
            { id:'fortune', t:'今日运势', d:'一段治愈系运势，和一枚属于今天的幸运色。', c:'from-violet-400 to-fuchsia-300' },
            { id:'tarot', t:'塔罗占卜', d:'22 张大阿尔卡纳，一次只抽一张，认真听你的问题。', c:'from-indigo-400 to-sky-300' },
            { id:'weather', t:'天气查询', d:'温度、风力，外加一句刚好的关怀。', c:'from-emerald-400 to-teal-300' },
          ].map(x=>`
            <button data-go="${x.id}" class="col-span-4 glass rounded-3xl p-6 text-left hover:shadow-xl transition group">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${x.c} mb-4 shadow"></div>
              <h4 class="font-serif text-xl mb-2">${x.t}</h4>
              <p class="text-sm text-slate-500 leading-6">${x.d}</p>
              <span class="inline-block mt-4 text-violet-500 text-sm">进入 →</span>
            </button>`).join('')}
        </div>`;
      document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
    }

    function paintFortune(text) {
      const el = document.getElementById('fortuneBody');
      if (!el) return;
      el.innerHTML = `
        <p class="text-violet-500 text-sm mb-3">凉月今日寄语 · ${todayKey()}</p>
        <p class="font-serif text-2xl leading-relaxed text-slate-800 whitespace-pre-wrap">${text}</p>`;
    }

    async function renderFortune() {
      document.getElementById('view').innerHTML = `
        <div class="max-w-3xl">
          <div class="glass rounded-3xl p-10 relative overflow-hidden">
            <div class="absolute right-0 top-0 w-56 h-56 bg-violet-200/40 blur-3xl rounded-full"></div>
            <div id="fortuneBody">
              <div class="flex flex-col items-center justify-center py-12">
                <div class="spinner mb-4"></div>
                <p class="text-violet-500 text-sm">凉月正在查看星象...</p>
              </div>
            </div>
            <div class="mt-8">
              <button id="refreshBtn" class="px-5 py-2.5 rounded-full bg-violet-500 text-white">刷新运势</button>
            </div>
          </div>
        </div>`;

      const reply = await callAI(SYSTEM_PROMPTS.fortune, "请给我今天的运势");
      paintFortune(reply === '__ERROR__' ? '吾的魔力暂时被干扰了，请稍后再试～' : reply);

      const btn = document.getElementById('refreshBtn');
      if (btn) btn.onclick = () => renderFortune();
    }

    let tarotState = { question: '', drawing: false, result: null };

    function renderTarot() {
      document.getElementById('view').innerHTML = `<div id="tarotBox" class="max-w-4xl"></div>`;
      paintTarot();
    }

    function paintTarot() {
      const box = document.getElementById('tarotBox');
      if (!box) return;
      if (tarotState.drawing) {
        box.innerHTML = `
          <div class="glass rounded-3xl p-10 flex flex-col items-center justify-center py-16">
            <div class="spinner mb-4"></div>
            <p class="text-violet-500 text-sm">凉月正在解读牌阵...</p>
          </div>`;
        return;
      }
      if (tarotState.result) {
        const r = tarotState.result;
        box.innerHTML = `
          <div class="grid grid-cols-12 gap-6">
            <div class="col-span-4 glass rounded-3xl p-8 flex flex-col items-center">
              <div class="w-44 h-64 rounded-2xl bg-gradient-to-br from-indigo-100 to-violet-200 flex flex-col items-center justify-center shadow-xl">
                <div class="text-5xl mb-3">✦</div>
                <div class="font-serif text-2xl">塔罗牌</div>
              </div>
            </div>
            <div class="col-span-8 glass rounded-3xl p-8">
              <p class="text-xs text-slate-400 mb-2">你的问题</p>
              <p class="font-medium mb-4">「${r.question}」</p>
              <p class="text-violet-500 text-sm mb-2">凉月的解读</p>
              <p class="leading-8 text-slate-700 whitespace-pre-wrap">${r.meaning}</p>
              <div class="flex gap-3 mt-8">
                <button id="retryTarot" class="px-5 py-2.5 rounded-full bg-white">重新提问</button>
              </div>
            </div>
          </div>`;
        document.getElementById('retryTarot').onclick = () => { tarotState = { question:'', drawing:false, result:null }; paintTarot(); };
        return;
      }

      box.innerHTML = `
        <div class="glass rounded-3xl p-10 max-w-3xl">
          <p class="text-slate-500 mb-6">把问题轻轻放下来，凉月会为你抽一张大阿尔卡纳。</p>
          <textarea id="qInput" maxlength="50" rows="3" class="w-full rounded-2xl border border-violet-100 p-4 outline-none bg-white/80" placeholder="例如：我最近的感情运势如何">${tarotState.question}</textarea>
          <button id="drawBtn" disabled class="mt-8 px-8 py-3 rounded-full bg-violet-400 text-white opacity-50">抽牌</button>
        </div>`;
      const input = document.getElementById('qInput');
      const drawBtn = document.getElementById('drawBtn');
      input.oninput = () => {
        const ok = input.value.trim().length > 0;
        drawBtn.disabled = !ok;
        drawBtn.className = ok ? 'mt-8 px-8 py-3 rounded-full bg-violet-500 text-white' : 'mt-8 px-8 py-3 rounded-full bg-violet-400 text-white opacity-50';
      };
      drawBtn.onclick = async () => {
        const q = input.value.trim();
        if (!q) return;
        tarotState.drawing = true;
        paintTarot();
        const reply = await callAI(SYSTEM_PROMPTS.tarot, `我的困惑是：${q}`);
        tarotState.drawing = false;
        tarotState.result = { question: q, meaning: reply === '__ERROR__' ? '吾的魔力暂时被干扰了，请稍后再试～' : reply };
        paintTarot();
      };
    }

    function renderWeather() {
      document.getElementById('view').innerHTML = `
        <div class="max-w-3xl glass rounded-3xl p-10">
          <input id="cityInput" class="w-full rounded-2xl border border-emerald-100 p-4 outline-none bg-white/80" placeholder="输入城市名，例如 杭州" />
          <button id="queryWeather" class="mt-4 px-6 py-2.5 rounded-full bg-emerald-500 text-white">查询天气</button>
          <div id="weatherResult" class="mt-8"></div>
        </div>`;
      const input = document.getElementById('cityInput');
      document.getElementById('queryWeather').onclick = async () => {
        const name = input.value.trim();
        if (!name) { toast('请输入城市名'); return; }
        const box = document.getElementById('weatherResult');
        box.innerHTML = `
          <div class="flex flex-col items-center justify-center py-12">
            <div class="spinner mb-4"></div>
            <p class="text-emerald-600 text-sm">凉月正在看云...</p>
          </div>`;
        const reply = await callAI(SYSTEM_PROMPTS.weather, `请告诉我${name}今天的天气`);
        const text = reply === '__ERROR__' ? '吾的魔力暂时被干扰了，请稍后再试～' : reply;
        box.innerHTML = `
          <div class="rounded-3xl bg-gradient-to-br from-sky-400 to-emerald-300 text-white p-8">
            <div class="text-sm opacity-90">${name}</div>
            <p class="mt-4 leading-8 whitespace-pre-wrap">${text}</p>
          </div>`;
      };
    }

    function chatMessages() {
      const list = store.get('chatMessages');
      if (list && list.length) return list;
      const welcome = [{ role: 'liangyue', text: CHAT_WELCOME, time: Date.now() }];
      store.set('chatMessages', welcome);
      return welcome;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderChat() {
      document.getElementById('view').innerHTML = `
        <div class="grid grid-cols-12 gap-6 h-[calc(100vh-10.5rem)]">
          <section class="col-span-12 glass rounded-3xl flex flex-col overflow-hidden">
            <div id="chatList" class="flex-1 overflow-y-auto p-6 space-y-4 chat-scroll"></div>
            <div class="px-6 pb-3 flex flex-wrap gap-2" id="chatChips"></div>
            <form id="chatForm" class="p-4 border-t border-violet-100 flex gap-3">
              <input id="chatInput" autocomplete="off" class="flex-1 rounded-2xl border border-violet-100 px-4 py-3 outline-none bg-white/80" placeholder="对凉月说点什么…" />
              <button class="px-6 rounded-2xl bg-violet-500 text-white shrink-0">发送</button>
            </form>
          </section>
        </div>`;
      const listEl = document.getElementById('chatList');
      const paint = () => {
        const data = chatMessages();
        listEl.innerHTML = data.map(m => m.role === 'user'
          ? `<div class="flex justify-end bubble-in"><div class="max-w-[75%] bg-violet-500 text-white rounded-3xl rounded-tr-md px-4 py-3 whitespace-pre-wrap">${escapeHtml(m.text)}</div></div>`
          : `<div class="flex gap-3 bubble-in"><div class="w-9 h-9 rounded-full bg-gradient-to-br from-violet-300 to-indigo-400 text-white flex items-center justify-center shrink-0">☽</div><div class="max-w-[75%] bg-white/80 rounded-3xl rounded-tl-md px-4 py-3 whitespace-pre-wrap text-slate-700">${escapeHtml(m.text)}</div></div>`
        ).join('');
        listEl.scrollTop = listEl.scrollHeight;
      };
      document.getElementById('chatChips').innerHTML = CHAT_CHIPS.map(c => `<button type="button" data-chip="${escapeHtml(c)}" class="px-3 py-1.5 rounded-full bg-violet-50 text-violet-600 text-sm">${c}</button>`).join('');
      document.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => sendChat(b.dataset.chip));
      document.getElementById('chatForm').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('chatInput');
        const v = input.value.trim();
        if (!v) return;
        input.value = '';
        sendChat(v);
      };
      async function sendChat(text) {
        const data = chatMessages();
        data.push({ role: 'user', text, time: Date.now() });
        store.set('chatMessages', data);
        paint();
        const typing = document.createElement('div');
        typing.className = 'flex gap-3';
        typing.innerHTML = `<div class="w-9 h-9 rounded-full bg-gradient-to-br from-violet-300 to-indigo-400 text-white flex items-center justify-center shrink-0">☽</div><div class="max-w-[75%] bg-white/80 rounded-3xl rounded-tl-md px-4 py-3 text-slate-700"><span class="text-violet-400 text-sm">凉月正在聆听你的话...</span></div>`;
        listEl.appendChild(typing);
        listEl.scrollTop = listEl.scrollHeight;
        const reply = await callAI(SYSTEM_PROMPTS.chat, text);
        typing.remove();
        const cur = chatMessages();
        cur.push({ role: 'liangyue', text: reply === '__ERROR__' ? '吾的魔力暂时被干扰了，请稍后再试～' : reply, time: Date.now() });
        store.set('chatMessages', cur);
        if (page === 'chat') paint();
      }
      paint();
    }

    function renderHistory() {
      const all = store.get('history', []);
      document.getElementById('view').innerHTML = `
        <div class="max-w-4xl">
          <div id="histList"></div>
        </div>`;
      const el = document.getElementById('histList');
      if (!all.length) {
        el.innerHTML = `<div class="glass rounded-3xl p-16 text-center"><p class="font-serif text-xl mb-2">还没有记录</p></div>`;
        return;
      }
      el.innerHTML = `<div class="space-y-3">${all.map(item => `
        <div class="w-full glass rounded-2xl p-5 text-left">
          <div class="text-xs text-slate-400">${new Date(item.time).toLocaleString()} · ${item.type==='tarot'?'塔罗占卜':'今日运势'}</div>
          <div class="font-medium mt-1">${item.title}</div>
          <div class="text-sm text-slate-500 mt-1 line-clamp-1">${item.summary}</div>
        </div>`).join('')}</div>`;
    }

    function renderMine() {
      document.getElementById('view').innerHTML = `
        <div class="max-w-3xl space-y-6">
          <div class="glass rounded-3xl p-8 flex items-center gap-5">
            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-pink-300 to-violet-400 text-white text-2xl flex items-center justify-center">☽</div>
            <div class="flex-1">
              <div class="font-serif text-2xl">月下旅人</div>
              <div class="text-sm text-slate-500">与凉月建立连接中</div>
            </div>
          </div>
        </div>`;
    }

    function setupPrivacy() {
      if (store.get('privacyAgreed')) return;
      const modal = document.getElementById('privacyModal');
      modal.classList.remove('hidden');
      const ck = document.getElementById('agreeCheck');
      const btn = document.getElementById('agreeBtn');
      ck.onchange = () => {
        btn.disabled = !ck.checked;
        btn.className = ck.checked ? 'w-full py-3 rounded-2xl bg-violet-500 text-white' : 'w-full py-3 rounded-2xl bg-violet-400 text-white opacity-50';
      };
      btn.onclick = () => { if (!ck.checked) return; store.set('privacyAgreed', true); modal.classList.add('hidden'); };
    }

    function init() {
      document.getElementById('todayStr').textContent = new Date().toLocaleDateString('zh-CN', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
      setupPrivacy();
      go('home');
    }
    init();
  </script>
</body>
</html>
